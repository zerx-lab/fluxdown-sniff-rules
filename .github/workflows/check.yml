name: check

# 手动 PR 的门禁：脚本测试 + 规则校验 + 规则自带测试。不接触签名密钥。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Script tests
        run: node --test scripts/*.test.mjs
      - name: Validate rules and run rule tests
        run: node scripts/build.mjs --check
