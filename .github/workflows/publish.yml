name: publish

# 每小时：收录登记仓库的新 Release（sources/）→ 校验全部规则 → 有变化或有效期将尽时签名发布到 dist/。
# main 上规则源变化时也立即运行。同一 job 内完成收录与签名（GITHUB_TOKEN 推送不会再触发工作流）。
on:
  push:
    branches: [main]
    paths:
      - rules/**
      - registry.json
      - revocations.json
      - vendor/**
      - scripts/**
      - keys.json
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'zerx-lab/fluxdown-sniff-rules'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Script tests
        run: node --test scripts/*.test.mjs
      - name: Stage registered repositories
        run: node scripts/stage.mjs --results "$RUNNER_TEMP/stage.json" --sync-issues "$GITHUB_REPOSITORY"
      - name: Validate, test and sign
        env:
          SNIFF_SIGNING_KEY: ${{ secrets.SNIFF_SIGNING_KEY }}
          SNIFF_SIGNING_KEY_ID: ${{ secrets.SNIFF_SIGNING_KEY_ID }}
        run: node scripts/build.mjs --sign --message "$RUNNER_TEMP/sign.txt"
      - name: Commit
        id: commit
        run: |
          git add -A sources dist
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            jq -r '.message // empty' "$RUNNER_TEMP/stage.json"
            cat "$RUNNER_TEMP/sign.txt" 2>/dev/null || true
          } | sed '/^$/d' > "$RUNNER_TEMP/message.txt"
          [ -s "$RUNNER_TEMP/message.txt" ] || echo "publish" > "$RUNNER_TEMP/message.txt"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -F "$RUNNER_TEMP/message.txt"
          git push origin HEAD:main
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.published == 'true'
        run: |
          for file in official community revocations; do
            curl -fsS "https://purge.jsdelivr.net/gh/zerx-lab/fluxdown-sniff-rules@main/dist/${file}.json" \
              || echo "::warning::jsDelivr purge failed for ${file}.json (cache expires on its own)"
          done
