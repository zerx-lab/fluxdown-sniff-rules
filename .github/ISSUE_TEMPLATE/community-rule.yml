name: 提交社区规则 / Submit a community rule
description: 一次性贡献：把在扩展「本地规则」里验证过的规则交给规则仓托管。/ One-off contribution of a rule you verified as a local rule.
title: "[规则] "
labels: [community-rule]
body:
  - type: markdown
    attributes:
      value: |
        这是**一次性贡献**的通道：规则会以 `community.misc.*` 收进本仓库，之后的修改也要再提 Issue，由维护者审核。
        打算长期维护某些站点的规则？请改用**自己的规则仓库**：登记一次，之后发 Release 自动收录，无需每次审核——见[维护自己的规则仓库](https://fluxdown.com/docs/zh/contributing/sniff-rules/#维护自己的规则仓库)。
        已被登记仓库认领的站点不接受此处提交，请向对应仓库贡献。

        This is the one-off channel (rules land as `community.misc.*`). To maintain rules long-term, publish them from your own repository and register it once — see the contributing guide.

        提交后机器人会自动校验并生成 Pull Request；校验失败会在下方回复原因，编辑本 Issue 即可重新校验。
        字段说明 / Field reference: https://fluxdown.com/docs/zh/browser-extension/sniff-rules/
  - type: textarea
    id: rule
    attributes:
      label: 规则 JSON / Rule JSON
      description: 在扩展「本地规则」行点击「提交到社区」会自动填好；也可粘贴单条规则、规则数组或导出的规则文件。`local.x` 会自动改为 `community.misc.x`。
      render: json
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 示例页面 / Example page
      description: 规则生效的一个真实页面地址。/ A real page where the rule applies.
      placeholder: https://www.example.com/video/123
    validations:
      required: true
  - type: textarea
    id: samples
    attributes:
      label: 示例资源地址 / Example resource URLs
      description: 规则应识别的资源地址，每行一个，可选；会自动生成测试。行首加 ! 表示该地址不应被识别。/ Resource URLs the rule should match, one per line (optional); tests are generated automatically. Prefix a line with ! if it must NOT match.
  - type: textarea
    id: tests
    attributes:
      label: 测试用例 / Test cases
      description: 可选。JSON 数组，格式见文档「规则测试」一节；有测试的规则审核更快。/ Optional JSON array; see "Rule tests" in the docs.
      render: json
  - type: textarea
    id: notes
    attributes:
      label: 说明 / Notes
      description: 规则解决什么问题、为什么这样写。/ What the rule fixes and why.
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认 / Confirm
      options:
        - label: 我已在扩展「本地规则」中验证该规则有效，且站点范围尽量小。/ I verified it as a local rule and kept the site scope minimal.
          required: true
